version: '3.8'

services:
  pandas-polars:
    image: python:3.11-slim
    container_name: benchmark-pandas-polars
    working_dir: /app
    volumes:
      - ./:/app
    command: >
      bash -c "pip install --no-cache-dir -r requirements.txt &&
               tail -f /dev/null"
    tty: true

  spark:
    image: bitnami/spark:3.5
    container_name: benchmark-spark
    environment:
      - SPARK_MODE=master
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - "8080:8080"
      - "4040:4040"
    tty: true